
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <fieldset>
        <legend>Contactez-moi</legend>
        
        <label for="r1">Civilité:Monsieur</label>
        <input  type="radio" id="r1" name="ss" checked required>
        <label for="r2">Madame</label>
        <input type="radio" id="r2" name="ss" required>
        <label for="r3">Mademoiselle</label>
        <input type="radio" id="r3" name="ss" required>
        <br> <br>
        <label for="t1">Nom:</label>
        <input type="text" placeholder="votre nom" id="t1" required>
        <label for="t2">Prénom:</label>
        <input type="text" id="t2" placeholder="votre prenom" required>
        <br> <br>
        <label for="t3">Email:</label>
        <input type="email" id="t3" placeholder="votre email" required>
        <label for="t4">Téléphone:</label>
        <input type="tel" id="t4" placeholder="votre telephone" required pattern="9[0-9]{7}" maxlength="8" titlela numero contenir 8 choffres et commencer par 9>
        <br> <br>
        <label for="t5">Sujet:</label>
        <input type="text" id="t5" placeholder="votre sujet" required>
        <br> <br>
        <label for="t6">Message:</label>
        <br>
        <textarea name="" id="t6" placeholder="votre message" rows="10" cols="16" required></textarea>
        <br> <br>
        <input type="submit" value="Envoyer">
        <input type="reset" value="Annuler">
        
    </fieldset>
    
</body>
</html>
